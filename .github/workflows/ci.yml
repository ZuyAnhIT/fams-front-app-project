name: App CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npx expo-doctor
      - run: npx expo install --check
